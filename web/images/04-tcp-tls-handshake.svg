<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Opening a secure connection: TCP handshake, then TLS 1.3</text>

  <!-- Lifelines -->
  <rect x="150" y="50" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Client</text>
  <rect x="610" y="50" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Server :443</text>
  <line x1="220" y1="90" x2="220" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="680" y1="90" x2="680" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- TCP band -->
  <rect x="20" y="105" width="860" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="35" y="125" font-size="13" font-weight="700" fill="#475569">TCP</text>
  <text x="35" y="143" font-size="12" fill="#64748b">reliable,</text>
  <text x="35" y="159" font-size="12" fill="#64748b">ordered</text>
  <text x="35" y="175" font-size="12" fill="#64748b">byte stream</text>

  <line x1="222" y1="140" x2="676" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#0f172a">SYN  — "can we talk?"</text>
  <line x1="678" y1="175" x2="224" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#0f172a">SYN-ACK  — "yes, can you hear me?"</text>
  <line x1="222" y1="205" x2="676" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="207" text-anchor="middle" font-size="13" fill="#0f172a">ACK  — "yes"</text>

  <!-- TLS band -->
  <rect x="20" y="245" width="860" height="125" rx="8" fill="#fefce8" stroke="#fde68a"/>
  <text x="35" y="265" font-size="13" font-weight="700" fill="#854d0e">TLS</text>
  <text x="35" y="283" font-size="12" fill="#a16207">encryption +</text>
  <text x="35" y="299" font-size="12" fill="#a16207">server identity</text>

  <line x1="222" y1="275" x2="676" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="275" text-anchor="middle" font-size="13" fill="#0f172a">ClientHello  — supported ciphers + key share</text>
  <line x1="678" y1="310" x2="224" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="312" text-anchor="middle" font-size="13" fill="#0f172a">ServerHello + certificate + Finished</text>
  <text x="450" y="355" text-anchor="middle" font-size="12" fill="#a16207">Client checks the certificate is valid for the hostname and signed by a trusted CA</text>

  <!-- HTTP -->
  <rect x="20" y="385" width="860" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="35" y="405" font-size="13" font-weight="700" fill="#166534">HTTP</text>
  <text x="35" y="423" font-size="12" fill="#15803d">encrypted</text>
  <line x1="222" y1="405" x2="676" y2="425" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#0f172a">Finished + GET /  (now encrypted)</text>
  <text x="450" y="447" text-anchor="middle" font-size="12" fill="#475569">Connections are reused (keep-alive) so this setup cost is paid once, not per request.</text>
</svg>
