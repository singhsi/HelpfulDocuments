<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">A typical production path behind "the server"</text>

  <!-- Browser -->
  <rect x="20" y="130" width="110" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Browser</text>

  <!-- CDN -->
  <rect x="170" y="130" width="120" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">CDN</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#4c1d95">edge cache</text>
  <text x="230" y="230" text-anchor="middle" font-size="11" fill="#6d28d9">serves static files</text>
  <text x="230" y="245" text-anchor="middle" font-size="11" fill="#6d28d9">(JS, CSS, images)</text>
  <text x="230" y="260" text-anchor="middle" font-size="11" fill="#6d28d9">close to the user</text>

  <!-- LB -->
  <rect x="330" y="130" width="140" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="400" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Load balancer /</text>
  <text x="400" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">reverse proxy</text>
  <text x="400" y="193" text-anchor="middle" font-size="11" fill="#831843">nginx, ALB, …</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#be185d">terminates TLS,</text>
  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#be185d">spreads traffic</text>

  <!-- App servers -->
  <rect x="520" y="60"  width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="87"  text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">App server #1</text>
  <text x="595" y="106" text-anchor="middle" font-size="11" fill="#14532d">Spring Boot, Node…</text>
  <rect x="520" y="210" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">App server #2</text>
  <text x="595" y="256" text-anchor="middle" font-size="11" fill="#14532d">same code, stateless</text>

  <!-- Data -->
  <rect x="730" y="60"  width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="805" y="87"  text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Cache</text>
  <text x="805" y="106" text-anchor="middle" font-size="11" fill="#78350f">Redis</text>
  <rect x="730" y="210" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="805" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Database</text>
  <text x="805" y="256" text-anchor="middle" font-size="11" fill="#78350f">PostgreSQL, …</text>

  <!-- Arrows -->
  <line x1="132" y1="165" x2="166" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="292" y1="165" x2="326" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="150" x2="516" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="180" x2="516" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="90"  x2="726" y2="90"  stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="240" x2="726" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="110" x2="726" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="222" x2="726" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#475569">Keep app servers stateless (sessions in a cache/DB or a token) so any instance can handle any request.</text>
</svg>
