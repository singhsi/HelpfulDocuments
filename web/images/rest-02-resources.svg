<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Resources are nouns, arranged like folders</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M60,92 V132 H90"/>
    <path d="M120,152 V192 H150"/>
    <path d="M180,212 V252 H210"/>
    <path d="M240,272 V312 H270"/>
  </g>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="30"  y="60"  width="120" height="34" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="45"  y="82"  fill="#0f172a">/api</text>

    <rect x="90"  y="118" width="190" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="105" y="140" fill="#1e3a8a">/users</text>

    <rect x="150" y="178" width="190" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="165" y="200" fill="#14532d">/users/42</text>

    <rect x="210" y="238" width="250" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="225" y="260" fill="#1e3a8a">/users/42/orders</text>

    <rect x="270" y="298" width="250" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="285" y="320" fill="#14532d">/users/42/orders/7</text>
  </g>

  <g font-size="13" fill="#475569">
    <text x="300" y="140">collection — all users</text>
    <text x="360" y="200">one item — user with id 42</text>
    <text x="480" y="260">sub-collection — orders of user 42</text>
    <text x="540" y="320">one order of user 42</text>
  </g>

  <!-- Do / Don't -->
  <rect x="600" y="55" width="280" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="615" y="80" font-size="14" font-weight="700" fill="#0f172a">Nouns in the URL, verb in the method</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="615" y="108" fill="#b91c1c">✗ GET<tspan x="669.6">/getUser?id=42</tspan></text>
    <text x="615" y="128" fill="#b91c1c">✗ POST /createUser</text>
    <text x="615" y="148" fill="#b91c1c">✗ POST /deleteUser/42</text>
    <text x="615" y="172" fill="#15803d">✓ GET<tspan x="669.6">/users/42</tspan></text>
    <text x="615" y="192" fill="#15803d">✓ POST<tspan x="669.6">/users</tspan></text>
  </g>

  <g font-size="12">
    <rect x="600" y="348" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="622" y="360" fill="#475569">Collection (plural noun)</text>
    <rect x="600" y="372" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="622" y="384" fill="#475569">Single item (collection + id)</text>
  </g>
</svg>
