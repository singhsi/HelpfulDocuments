<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DNS lookup: turning example.com into an IP address</text>

  <!-- Client -->
  <rect x="30" y="160" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Your machine</text>
  <text x="125" y="213" text-anchor="middle" font-size="12" fill="#1e3a8a">browser cache →</text>
  <text x="125" y="230" text-anchor="middle" font-size="12" fill="#1e3a8a">OS cache → /etc/hosts</text>

  <!-- Resolver -->
  <rect x="330" y="160" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Recursive resolver</text>
  <text x="430" y="213" text-anchor="middle" font-size="12" fill="#78350f">ISP, 1.1.1.1, 8.8.8.8</text>
  <text x="430" y="230" text-anchor="middle" font-size="12" fill="#78350f">caches answers (TTL)</text>

  <!-- Name servers -->
  <rect x="660" y="60"  width="210" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="765" y="90"  text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Root server  ( . )</text>
  <text x="765" y="111" text-anchor="middle" font-size="12" fill="#475569">"ask the .com servers"</text>

  <rect x="660" y="170" width="210" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="765" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TLD server  ( .com )</text>
  <text x="765" y="221" text-anchor="middle" font-size="12" fill="#475569">"ask example.com's NS"</text>

  <rect x="660" y="280" width="210" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Authoritative server</text>
  <text x="765" y="331" text-anchor="middle" font-size="12" fill="#14532d">"A record: 93.184.216.34"</text>

  <!-- client <-> resolver -->
  <line x1="222" y1="190" x2="327" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1</text>
  <line x1="327" y1="225" x2="222" y2="225" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="274" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5</text>

  <!-- resolver <-> name servers -->
  <line x1="532" y1="175" x2="657" y2="95"  stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="585" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2</text>
  <line x1="532" y1="205" x2="657" y2="205" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="595" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3</text>
  <line x1="532" y1="235" x2="657" y2="315" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="585" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4</text>

  <text x="30" y="300" font-size="13" fill="#475569">If any cache already has a fresh answer,</text>
  <text x="30" y="318" font-size="13" fill="#475569">the lookup stops there — usually a few ms.</text>
  <text x="30" y="350" font-size="13" fill="#475569">Try it:  <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#0f172a">dig +trace example.com</tspan></text>
</svg>
