<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Stateless auth: every request carries its own token</text>

  <!-- lifelines -->
  <rect x="130" y="50" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Client</text>
  <rect x="630" y="50" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">API</text>
  <line x1="200" y1="90" x2="200" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="700" y1="90" x2="700" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <g font-size="13" fill="#0f172a">
    <!-- 1 login -->
    <line x1="202" y1="120" x2="696" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="113" text-anchor="middle"><tspan font-weight="700">1.</tspan> POST /auth/login  { username, password }</text>
    <!-- 2 token -->
    <line x1="698" y1="160" x2="204" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="450" y="153" text-anchor="middle"><tspan font-weight="700">2.</tspan> 200 OK  { "access_token": "eyJ...", "expires_in": 900 }</text>

    <!-- 3 call -->
    <line x1="202" y1="215" x2="696" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="200" text-anchor="middle"><tspan font-weight="700">3.</tspan> GET /orders</text>
    <text x="450" y="233" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1e3a8a">Authorization: Bearer eyJ...</text>

    <!-- verify note -->
    <rect x="715" y="200" width="170" height="54" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="800" y="222" text-anchor="middle" font-size="12" fill="#713f12">verify signature + expiry,</text>
    <text x="800" y="240" text-anchor="middle" font-size="12" fill="#713f12">check permissions</text>

    <!-- 4 response -->
    <line x1="698" y1="275" x2="204" y2="275" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="450" y="268" text-anchor="middle"><tspan font-weight="700">4.</tspan> 200 OK  [ { "id": 7, ... } ]</text>

    <!-- 5 missing token -->
    <line x1="202" y1="320" x2="696" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="313" text-anchor="middle"><tspan font-weight="700">5.</tspan> GET /orders  (no token, or expired)</text>
    <line x1="698" y1="355" x2="204" y2="355" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="450" y="348" text-anchor="middle" fill="#b91c1c"><tspan font-weight="700">6.</tspan> 401 Unauthorized</text>
  </g>

  <g font-size="12" fill="#475569">
    <text x="20" y="200">No server-side</text>
    <text x="20" y="216">session needed:</text>
    <text x="20" y="232">any instance can</text>
    <text x="20" y="248">handle step 3.</text>
  </g>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#64748b">Always over HTTPS — a token is as good as a password to whoever holds it.</text>
</svg>
